<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 195" width="800" height="195">
  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes drawRing {
      from { stroke-dasharray: 0 150; }
      to { stroke-dasharray: 150 0; }
    }
    .fade-in {
      animation: fadeIn 0.8s ease forwards;
    }
    .draw-ring {
      animation: drawRing 1.2s ease-out forwards;
    }
  </style>

  <!-- Outer Card Border (no rounded corners, grayscale) -->
  <rect x="0.5" y="0.5" width="799" height="194" fill="#000000" stroke="#262626" stroke-width="1" />

  <!-- Vertical Divider (separating left and right) -->
  <line x1="520" y1="20" x2="520" y2="175" stroke="#262626" stroke-width="1" />

  <!-- LEFT SECTION: Streak Statistics -->
  <g class="fade-in">
    <!-- Total Contributions -->
    <text x="95" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">94</text>
    <text x="95" y="122" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Total Contributions</text>
    <text x="95" y="152" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Apr 30, 2024 - Present</text>

    <!-- Current Streak (with circular ring and flame icon) -->
    <!-- Circular Ring center (260, 76), radius 24 -->
    <circle cx="260" cy="76" r="24" fill="none" stroke="#262626" stroke-width="2.5" />
    <circle class="draw-ring" cx="260" cy="76" r="24" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="150" transform="rotate(-90 260 76)" />
    
    <!-- Mask to prevent the ring line from cutting through the flame -->
    <circle cx="260" cy="48" r="9" fill="#000000" />
    
    <!-- Flame Icon (translated to top center of the ring) -->
    <path d="M 11.36 0.17 C 11.66 0.44 11.83 0.82 11.83 1.23 C 11.82 3.23 10.19 4.39 10.19 5.37 C 10.19 6.22 10.87 6.9 11.72 6.9 C 12.35 6.9 12.9 6.52 13.13 5.92 C 13.56 7.6 15.11 8.82 16.92 8.82 C 18.9 8.82 20.5 7.22 20.5 5.24 C 20.5 4.89 20.44 4.55 20.34 4.22 C 21.6 5.35 22.4 7.02 22.4 8.87 C 22.4 12.59 19.38 15.61 15.66 15.61 C 15.28 15.61 14.9 15.58 14.53 15.52 C 14.88 15.01 15.08 14.41 15.08 13.77 C 15.08 11.96 13.62 10.5 11.81 10.5 C 11.21 10.5 10.65 10.66 10.17 10.94 C 10.06 10.19 9.77 9.48 9.33 8.88 C 8.67 9.72 8.28 10.77 8.28 11.91 C 8.28 14.77 10.6 17.09 13.46 17.09 C 13.84 17.09 14.22 17.05 14.58 16.97 C 14.22 18.06 13.18 18.84 11.96 18.84 C 10.19 18.84 8.75 17.4 8.75 15.63 C 8.75 15.29 8.81 14.95 8.9 14.63 C 7.64 15.76 6.84 17.43 6.84 19.28 C 6.84 23 9.86 26.02 13.58 26.02 C 18.52 26.02 22.52 22.02 22.52 17.08 C 22.52 10.78 17.42 5.67 11.36 0.17 Z" fill="#58a6ff" transform="translate(248.5, 34) scale(0.9)" />
    
    <text x="260" y="84" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">2</text>
    <text x="260" y="122" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Current Streak</text>
    <text x="260" y="152" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Aug 28 - Aug 29</text>

    <!-- Longest Streak -->
    <text x="425" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">4</text>
    <text x="425" y="122" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Longest Streak</text>
    <text x="425" y="152" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Nov 24 - Nov 27, 2025</text>
  </g>

  <!-- RIGHT SECTION: Currently Building Panel -->
  <g class="fade-in">
    <!-- Header Title (Consolas, muted gray, matching Skill Radar) -->
    <text x="552" y="58" fill="#8b949e" font-family="Consolas, 'SF Mono', Monaco, monospace" font-size="10" font-weight="bold" letter-spacing="1.5px">CURRENTLY BUILDING</text>

    <!-- Items List (Ice-blue arrows and desaturated white text, font-weight normal) -->
    <!-- Item 1 -->
    <text x="552" y="84" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">→</text>
    <text x="572" y="84" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="normal">Generative AI</text>

    <!-- Item 2 -->
    <text x="552" y="104" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">→</text>
    <text x="572" y="104" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="normal">LLM Applications</text>

    <!-- Item 3 -->
    <text x="552" y="124" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">→</text>
    <text x="572" y="124" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="normal">Agentic Workflows</text>

    <!-- Item 4 -->
    <text x="552" y="144" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">→</text>
    <text x="572" y="144" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="normal">RAG Systems</text>
  </g>
</svg>