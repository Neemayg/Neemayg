    <!-- Total Contributions -->
    <text x="95" y="88" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">94</text>
    <text x="95" y="115" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Total Contributions</text>
