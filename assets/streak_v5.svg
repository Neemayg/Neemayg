    <text x="425" y="88" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">4</text>
    <text x="425" y="115" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Longest Streak</text>
    <text x="425" y="140" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Nov 24 - Nov 27, 2025</text>
  </g>

