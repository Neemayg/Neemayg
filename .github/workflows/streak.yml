name: Update GitHub Streak & Contributions

on:
  schedule:
    - cron: '0 * * * *'  # Automatically runs every 1 hour
  workflow_dispatch:      # Allows manual trigger anytime from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'generate_streak.py'
      - '.github/workflows/streak.yml'

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Dynamic Streak Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate_streak.py

      - name: Commit and Push Updated SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak_v5.svg
          git commit -m "auto: update streak & contribution stats SVG" || exit 0
          git push
